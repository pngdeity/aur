name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency: release-${{ github.ref }}
jobs:
  build:
    name: Build packages
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:6d08b7067286234b755a28340b6bd89f3a2289233dbca3c361464f27ecae8f08
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: '1693526400'
    steps:
      - name: Install devtools and git
        run: pacman -Syu --noconfirm devtools git
      - uses: actions/checkout@v6
      - name: Build packages
        run: |
          set -euo pipefail
          PKGS=$(find packages -mindepth 2 -maxdepth 2 -name PKGBUILD -exec dirname {} \; | sort)
          for PKG_DIR in $PKGS; do
            echo "==> Building $PKG_DIR"
            pushd "$PKG_DIR" > /dev/null
            makepkg --syncdeps --noconfirm --noprogressbar --clean
            mkdir -p "$GITHUB_WORKSPACE/dist"
            cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
            popd > /dev/null
            MAKEDEPS=$(makepkg --printsrcinfo "$PKG_DIR/PKGBUILD" 2>/dev/null | grep -oP '^\s*makedepends = \K.*' | tr '\n' ' ' || true)
            [ -n "$MAKEDEPS" ] && pacman -Rsn --noconfirm $MAKEDEPS 2>/dev/null || true
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chroot-packages-${{ github.run_id }}
          path: dist/*.pkg.tar.zst
  publish-binary:
    needs: build
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    container: ghcr.io/pngdeity/aur/arch-builder:latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
      HOST: ${{ secrets.REPO_HOST }}
      USER: ${{ secrets.REPO_USER }}
      SSH_KEY: ${{ secrets.REPO_SSH_PRIVATE_KEY }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: chroot-packages-${{ github.run_id }}
          path: dist
      - name: Publish to binary repository
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::warning::Binary publish secrets not configured. Skipping."
            exit 0
          fi

          if ! compgen -G "dist/*.pkg.tar.zst" > /dev/null; then
            echo "No packages built. Skipping publish."
            exit 0
          fi

          mkdir -p ~/.ssh repo-root/x86_64
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          if [ -n "$GPG_KEY" ]; then
            printf '%s' "$GPG_KEY" | gpg --batch --import --no-tty 2>/dev/null
          fi

          rsync -avz -e "ssh" "$USER@$HOST:/var/www/html/repo/nightly/" repo-root/ || echo "First run — no remote repo."

          find repo-root/x86_64/ -name "*.pkg.tar.zst" -type f -mtime +7 -delete
          cp dist/*.pkg.tar.zst repo-root/x86_64/

          cd repo-root/x86_64/
          PKG_COUNT=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l)
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "::error::No packages in repo-root after copy. Aborting rsync --delete."
            exit 1
          fi

          rm -f nightly.db.tar.gz nightly.db nightly.files.tar.gz nightly.files
          if [ -n "$GPG_KEY" ]; then
            repo-add --sign nightly.db.tar.gz ./*.pkg.tar.zst
          else
            repo-add nightly.db.tar.gz ./*.pkg.tar.zst
          fi

          cd "$OLDPWD"
          rsync -avz --delete -e "ssh" repo-root/ "$USER@$HOST:/var/www/html/repo/nightly/"
  deploy-aur:
    needs: build
    if: |
      github.repository == 'pngdeity/aur' &&
      !failure() &&
      !cancelled() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    container: ghcr.io/pngdeity/aur/arch-builder:latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Deploy to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY not configured. Skipping."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_aur
          chmod 600 ~/.ssh/id_aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat > ~/.ssh/config << 'SSHCONF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/id_aur
              IdentitiesOnly yes
          SSHCONF

          FAILURES=0
          for PKG_DIR in $(find packages -mindepth 2 -maxdepth 2 -name PKGBUILD -exec dirname {} \; | sort); do
            if [ -f "$PKG_DIR/PKGBUILD" ]; then
              if ! bash scripts/aur-deploy.sh "$PKG_DIR"; then
                echo "::warning::$PKG_DIR AUR deployment failed"
                FAILURES=$((FAILURES + 1))
              fi
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES AUR deployment(s) failed"
            exit 1
          fi
