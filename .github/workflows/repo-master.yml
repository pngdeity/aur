name: Master Repo Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - chore/recreate-and-align-gha
    paths:
      - 'packages/**'
      - '.github/workflows/repo-master.yml'
      - 'nvc_versions.json'
      - 'nvchecker.toml'

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/arch-builder
  REPO_NAME: my_private_repo

jobs:
  check-updates:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      updates: ${{ steps.check.outputs.updates }}
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm nvchecker jq git

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Run nvchecker
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[keys]" > keyfile.toml
          echo "github = \"$GITHUB_TOKEN\"" >> keyfile.toml
          nvchecker -k keyfile.toml -c nvchecker.toml
          # Check if newver file exists and has content
          if [ -f "nvc_versions_new.json" ]; then
             UPDATES=$(nvcmp -c nvchecker.toml --json)
             if [ "$UPDATES" != "[]" ]; then
               echo "has_updates=true" >> $GITHUB_OUTPUT
               MATRIX_JSON=$(echo "$UPDATES" | jq -c '[.[] | {name: .name, version: .newver}]')
               echo "updates=$MATRIX_JSON" >> $GITHUB_OUTPUT
             else
               echo "has_updates=false" >> $GITHUB_OUTPUT
               echo "updates=[]" >> $GITHUB_OUTPUT
             fi
          else
             echo "has_updates=false" >> $GITHUB_OUTPUT
             echo "updates=[]" >> $GITHUB_OUTPUT
          fi

  build-packages:
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.check-updates.outputs.updates) }}
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm devtools jq git sudo base-devel rclone

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Cache pacman packages
        uses: actions/cache@v5
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-pacman-${{ hashFiles('packages/${{ matrix.package.name }}/PKGBUILD') }}
          restore-keys: |
            ${{ runner.os }}-pacman-

      - name: Configure Build User
        run: |
          useradd -m builder || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update Package source
        run: |
          cd "packages/${{ matrix.package.name }}"
          if [ -f "update.sh" ]; then
             bash "update.sh" "${{ matrix.package.version }}"
          else
             sed -i "s/^pkgver=.*/pkgver=${{ matrix.package.version }}/" PKGBUILD
             sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
             updpkgsums
          fi

      - name: Build Package
        run: |
          cd "packages/${{ matrix.package.name }}"
          sudo -u builder extra-x86_64-build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package.name }}
          path: packages/${{ matrix.package.name }}/*.pkg.tar.zst

  deploy-repo:
    needs: [check-updates, build-packages]
    if: always() && (needs.build-packages.result == 'success' || (github.event_name == 'push' && needs.build-packages.result != 'failure'))
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm rclone devtools jq git

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-pkgs
          pattern: pkg-*
          merge-multiple: true

      - name: Deploy to Backend
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "R2_ACCESS_KEY_ID is not set. Skipping deployment."
            exit 0
          fi

          mkdir -p ~/.config/rclone/
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT_URL
          acl = private
          EOF

          # Create deploy directory
          mkdir -p deploy/x86_64

          # Download existing database files to update them
          echo "Downloading existing database from R2..."
          rclone copy r2:$R2_BUCKET_NAME/x86_64/ deploy/x86_64/ --include "*.db*" --include "*.files*" || echo "No existing database found."

          # Copy newly built packages
          cp all-pkgs/*.pkg.tar.zst deploy/x86_64/

          # Update Repository Database
          cd deploy/x86_64
          repo-add ${{ env.REPO_NAME }}.db.tar.gz *.pkg.tar.zst
          ln -sf ${{ env.REPO_NAME }}.db.tar.gz ${{ env.REPO_NAME }}.db
          ln -sf ${{ env.REPO_NAME }}.files.tar.gz ${{ env.REPO_NAME }}.files
          cd ../..

          # Upload everything back to R2
          rclone copy deploy/x86_64/ r2:$R2_BUCKET_NAME/x86_64/ --verbose

      - name: Commit Version State
        if: needs.check-updates.outputs.has_updates == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # nvtake updates oldver with newver
          nvtake -c nvchecker.toml --all
          git config user.name "Auto-Packager"
          git config user.email "actions@github.com"
          git add nvc_versions.json packages/*/PKGBUILD
          # Add extra files if they changed (like ranger-doas patch)
          git add packages/*/doas-substitution.patch || true
          git commit -m "chore: automated upstream update"
          git push
