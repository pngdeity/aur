name: Nightly Release Orchestrator
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      chunks_json:
        required: true
        type: string # JSON array of objects: [{"index": 0, "list": [...]}, ...]

jobs:
  # Matrix-based orchestration calling the executor
  run-builds:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.chunks_json) }}
    uses: ./.github/workflows/package-executor.yml
    with:
      version: ${{ inputs.version }}
      package_list: ${{ toJson(matrix.list) }}
      chunk_index: ${{ matrix.index }}
    secrets: inherit

  # Final collection and professional repository publishing
  publish:
    needs: run-builds
    runs-on: ubuntu-latest
    # Using Arch container for native repo-add tool
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm pacman-contrib rsync openssh nodejs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-dist
          pattern: nightly-packages-batch-*
          merge-multiple: true

      - name: Create Arch Repository Structure
        run: |
          # 1. Create standard Arch architecture-specific structure
          mkdir -p repo-root/x86_64/
          
          # 2. Populate with all built packages
          cp final-dist/*.pkg.tar.zst repo-root/x86_64/
          
          # 3. Generate the mandatory pacman repository database
          # This creates 'nightly.db.tar.gz' for use in pacman.conf
          cd repo-root/x86_64/
          repo-add nightly.db.tar.gz *.pkg.tar.zst
          cd ../..

      - name: Upload to External Apache Host
        env:
          SSH_KEY: ${{ secrets.REPO_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.REPO_HOST }}
          USER: ${{ secrets.REPO_USER }}
        run: |
          # 4. Configure SSH for automated transport
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          
          # 5. Atomic sync of the repository structure to the web root
          rsync -avz -e "ssh" repo-root/ "$USER@$HOST:/var/www/html/repo/nightly/"
