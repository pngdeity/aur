name: Discovery
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
concurrency: discovery-${{ github.ref }}
jobs:
  check:
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    container: ghcr.io/pngdeity/aur/arch-builder:latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect and sync
        id: sync
        run: |
          set -euo pipefail
          rm -f /tmp/has_changes

          { echo "[__config__]"; echo "oldver = 'oldver.json'"; } > master.toml
          {
            find packages -mindepth 2 -maxdepth 2 -name .nvchecker.toml -print0 |
              xargs -0 grep -hv '^\[__config__\]'
          } >> master.toml
          [ ! -f oldver.json ] && echo '{}' > oldver.json

          nvchecker -c master.toml --logger json > results.json

          jq -c 'select(.event == "updated")' results.json | while read -r row; do
            name=$(echo "$row" | jq -r .name)
            ver=$(echo "$row" | jq -r .version)
            bash scripts/sync-package.sh "$name" "$ver"
            echo "true" > /tmp/has_changes
          done

          if [ -f /tmp/has_changes ]; then
            nvtake -c master.toml --all
          fi

          if [ -f /tmp/has_changes ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d-%H%M)
          BRANCH="chore/auto-update-${DATE}"

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch ${BRANCH} already exists — skipping."
            exit 0
          fi

          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git add oldver.json packages/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: automated upstream update"

          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: automated upstream update" \
            --body "Automated version bumps detected by nvchecker."
