name: Discovery
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
concurrency: discovery-${{ github.ref }}
jobs:
  check:
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    container: ghcr.io/pngdeity/aur/arch-builder:latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dedicated read-only token. The automatic installation token is scoped to
      # this repository, and nvchecker queries upstream repos owned by others.
      NVCHECKER_GITHUB_TOKEN: ${{ secrets.NVCHECKER_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect and sync
        id: sync
        run: |
          set -euo pipefail
          rm -f /tmp/has_changes

          # makepkg refuses to run as root, so sync-package.sh (which calls
          # updpkgsums) must run as the image's unprivileged builder user, the
          # same way build.yml invokes arch-builder.sh. sync-package.sh rewrites
          # PKGBUILDs in place, so the working tree must be builder-writable --
          # but .git must not change hands: actions/checkout stores the push
          # credential in .git/config, and the Open PR step runs as root and has
          # to keep reading that repo. Chowning .git made git reject the
          # repository in the next step ('origin' does not appear to be a git
          # repository, then "not in a git directory" from gh).
          #
          # git also refuses a repository owned by another user, so the tree is
          # registered as safe for both users. The tree root itself is included
          # because nvchecker writes newver.json into it, so builder needs write
          # permission on the directory, not just on its contents.
          chown -R builder:builder .
          chown -R root:root .git
          git config --global --add safe.directory "$PWD"
          sudo -u builder git config --global --add safe.directory "$PWD"

          # nvchecker's github source reads a token only from a TOML keyfile or
          # ~/.netrc -- it never consults GITHUB_TOKEN. Write the keyfile from
          # the environment so the value stays off every command line. It is
          # created builder-owned because nvchecker runs as builder and the
          # 0600 mode would otherwise lock that user out.
          install -m 600 -o builder -g builder /dev/null keyfile.toml
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path("keyfile.toml").write_text(
            f'[keys]\ngithub = "{os.environ["NVCHECKER_GITHUB_TOKEN"]}"\n'
          )
          PY

          # keyfile is a __config__ key, so it must be written inside the
          # __config__ table -- appending it after the package tables would put
          # it in the last package's section and nvchecker would ignore it.
          # nvtake requires *both* version files to be declared: load_file only
          # populates ver_files when oldver and newver are present together, and
          # nvtake exits 2 otherwise. nvchecker writes newver.json during the run
          # and nvtake --all folds it into oldver.json. newver.json needs no
          # pre-creation -- read_verfile returns {} when the file is absent.
          { echo "[__config__]"; echo "oldver = 'oldver.json'"; echo "newver = 'newver.json'"; echo "keyfile = 'keyfile.toml'"; } > master.toml
          {
            find packages -mindepth 2 -maxdepth 2 -name .nvchecker.toml -print0 |
              xargs -0 grep -hv '^\[__config__\]'
          } >> master.toml
          [ ! -f oldver.json ] && echo '{}' > oldver.json
          chown builder:builder master.toml oldver.json
          sudo -u builder nvchecker -c master.toml --logger json > results.json

          jq -r 'select(.event == "updated") | "\(.name)\t\(.version)"' results.json | while IFS=$'\t' read -r name ver; do
            sudo -u builder bash scripts/sync-package.sh "$name" "$ver"
            echo "true" > /tmp/has_changes
          done

          if [ -f /tmp/has_changes ]; then
            sudo -u builder nvtake -c master.toml --all
          fi

          if [ -f /tmp/has_changes ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          rm -f keyfile.toml
      - name: Open PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y%m%d-%H%M)
          BRANCH="chore/auto-update-${DATE}"

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch ${BRANCH} already exists — skipping."
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Action"
          git checkout -b "$BRANCH"
          git add oldver.json packages/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: automated upstream update"

          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: automated upstream update" \
            --body "Automated version bumps detected by nvchecker."
