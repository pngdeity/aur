name: Package Executor
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      package_list:
        required: true
        type: string # JSON array of package dirs
      chunk_index:
        required: true
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Environment
        run: |
          pacman -Syu --noconfirm base-devel git pacman-contrib sudo jq
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .
          chmod +x scripts/arch-builder.sh

      - name: Build Batch
        run: |
          PACKAGES=$(echo '${{ inputs.package_list }}' | jq -r '.[]')
          for PKG in $PACKAGES; do
            if [ -d "$PKG" ]; then
              # Delegate all build logic to the Arch-native script
              sudo -u builder ./scripts/arch-builder.sh "$PKG" "${{ inputs.version }}"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-packages-batch-${{ inputs.chunk_index }}
          path: dist/*.pkg.tar.zst
