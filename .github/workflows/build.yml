name: Build
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'schemas/**'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'schemas/**'
  workflow_dispatch:
    inputs:
      package:
        required: false
        type: string
        description: 'Specific package directory to build (e.g. packages/apm)'
      version:
        required: false
        type: string
        description: 'Version string to pass to arch-builder.py'
concurrency: build-${{ github.ref }}
jobs:
  validate:
    name: Validate PKGBUILDs
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PKL_VERSION: 0.31.1
      CONFTEST_VERSION: 0.68.2
    steps:
      - uses: actions/checkout@v6
      - name: Install pkl
        uses: pkl-community/setup-pkl@d90f0decffd4420db21c20076096e4ed21696781 # v0.0.8+ (Node.js 24)
        with:
          pkl-version: ${{ env.PKL_VERSION }}
      - name: Install conftest
        run: |
          URL="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL "$URL" -o conftest.tar.gz
          echo "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347  conftest.tar.gz" > conftest.sha256
          sha256sum -c conftest.sha256
          tar xzf conftest.tar.gz && sudo mv conftest /usr/local/bin/
          rm conftest.tar.gz conftest.sha256
      - name: Install Python deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 python3-yaml
      - name: Validate
        run: python3 scripts/validate-pkgbuilds-pkl.py
  build:
    name: Build packages
    needs: validate
    if: github.repository == 'pngdeity/aur'
    runs-on: ubuntu-latest
    container: ghcr.io/pngdeity/aur/arch-builder:latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_DATE_EPOCH: '1693526400'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check pkgdesc consistency
        run: python3 ./scripts/check-pkgdesc-consistency.py --ci
      - name: Build packages
        run: |
          # Excluded from the build set: packages whose dependencies are not
          # available in any Arch repository. They cannot build here, and
          # excluding them is a statement about CI coverage, not a claim that
          # they are correct. `apm` needs python-frontmatter, python-llm and
          # python-llm-github-models; the last exists on neither the repos nor
          # the AUR. See docs/TODO.md, Engineering (CI/CD).
          EXCLUDE_PKGS=("packages/apm")

          if [ -n "${{ inputs.package }}" ]; then
            PKGS="${{ inputs.package }}"
          else
            PKGS=$(find packages -mindepth 2 -maxdepth 2 -name PKGBUILD -exec dirname {} \; | sort)
          fi

          failed=""
          skipped=""
          passed=0
          for PKG_DIR in $PKGS; do
            if [ ! -f "$PKG_DIR/PKGBUILD" ]; then
              continue
            fi

            excluded=false
            for excl in "${EXCLUDE_PKGS[@]}"; do
              if [ "$PKG_DIR" = "$excl" ]; then
                excluded=true
                break
              fi
            done
            if $excluded; then
              echo "::warning::$PKG_DIR is excluded from the CI build set"
              skipped="$skipped $PKG_DIR"
              continue
            fi

            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION=$(grep -oP '^pkgver=\K.*' "$PKG_DIR/PKGBUILD" | tr -d "'\"")
            fi

            # Each package is built independently; one failure must not
            # suppress the rest. Results are collected and reported together.
            if sudo -u builder python3 ./scripts/arch-builder.py "$PKG_DIR" "$VERSION"; then
              passed=$((passed + 1))
            else
              echo "::error::$PKG_DIR failed to build"
              failed="$failed $PKG_DIR"
            fi
          done

          echo "==> Build summary: ${passed} passed, $(echo $failed | wc -w) failed, $(echo $skipped | wc -w) excluded"
          if [ -n "$failed" ]; then
            echo "::error::Failed packages:${failed}"
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ github.run_id }}
          path: /tmp/makepkg-dist/*.pkg.tar.zst
