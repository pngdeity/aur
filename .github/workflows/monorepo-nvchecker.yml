name: Monorepo nvchecker
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      chunks_json: ${{ steps.get-updates.outputs.chunks_json }}
      has_updates: ${{ steps.get-updates.outputs.has_updates }}
      version: ${{ steps.get-updates.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm nvchecker pacman-contrib jq git curl

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: get-updates
        name: Consolidate, Run nvchecker, and Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sanity Check: Ensure the master config exists and isn't empty
          if [ ! -s .nvchecker.toml ] || ! grep -q "^\[" .nvchecker.toml; then
            echo "::error::Master configuration .nvchecker.toml is missing or empty! Aborting."
            exit 1
          fi

          echo "[__config__]" > master.toml
          echo "oldver = 'oldver.json'" >> master.toml
          
          find . -maxdepth 2 -name ".nvchecker.toml" -not -path "./.nvchecker.toml" | while read -r config; do
            echo "" >> master.toml
            grep -v "^\[__config__\]" "$config" >> master.toml
          done

          if [ ! -f oldver.json ]; then echo "{}" > oldver.json; fi

          nvchecker -c master.toml --logger json | tee results.json
          
          # Run intelligent synchronization for each updated package
          jq -c 'select(.event=="updated")' results.json | while read -r update; do
            NAME=$(echo "$update" | jq -r '.name')
            VER=$(echo "$update" | jq -r '.version')
            # The sync script handles versioning, hashes, and changelogs
            bash scripts/sync-package.sh "$NAME" "$VER"
          done

          UPDATED_NAMES=$(jq -r 'select(.event=="updated") | .name' results.json | jq -R . | jq -s -c .)
          
          if [ "$UPDATED_NAMES" != "[]" ]; then
            # Chunk into an array of objects for matrix.include
            CHUNKS_JSON=$(echo "$UPDATED_NAMES" | jq -c '[_n_] as $n | [range(0; length; $n) as $i | {index: ($i/$n), list: .[$i:$i+$n]}]' --argjson n 50)
            VERSION=$(jq -r 'select(.event=="updated") | .version' results.json | head -n 1)
            
            echo "chunks_json=$CHUNKS_JSON" >> $GITHUB_OUTPUT
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            
            nvtake -c master.toml --all
            
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add oldver.json packages/
            git commit -m "chore: automated upstream update [skip ci]"
            git push
          else
            echo "chunks_json=[]" >> $GITHUB_OUTPUT
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    uses: ./.github/workflows/nightly-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      chunks_json: ${{ needs.check.outputs.chunks_json }}
    secrets: inherit
